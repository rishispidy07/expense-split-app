<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SplitEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;min-height:100vh;background:#0f0f23;overflow:hidden;position:relative}

        .bg-gradient{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f23 0%,#1a1a3e 50%,#0f0f23 100%);z-index:0}

        .floating-shapes{position:fixed;inset:0;z-index:1;pointer-events:none;perspective:1000px}
        .shape{position:absolute;border-radius:50%;filter:blur(1px);animation:float 20s infinite ease-in-out}
        .shape-1{width:300px;height:300px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.08));top:-100px;right:-100px;animation-delay:0s;transform:rotateX(45deg) rotateZ(45deg)}
        .shape-2{width:200px;height:200px;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(52,211,153,.06));bottom:-50px;left:-50px;animation-delay:-5s;transform:rotateX(-30deg) rotateZ(30deg)}
        .shape-3{width:150px;height:150px;background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(244,114,182,.05));top:50%;left:20%;animation-delay:-10s;transform:rotateX(60deg) rotateZ(-45deg)}
        .shape-4{width:100px;height:100px;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(251,191,36,.05));top:30%;right:15%;animation-delay:-15s;transform:rotateX(-45deg) rotateZ(60deg)}
        .shape-5{width:80px;height:80px;background:linear-gradient(135deg,rgba(14,165,233,.1),rgba(56,189,248,.05));bottom:20%;right:30%;animation-delay:-8s;transform:rotateX(30deg) rotateZ(-30deg)}

        @keyframes float{
            0%,100%{transform:translateY(0) rotateX(var(--rx,45deg)) rotateZ(var(--rz,45deg))}
            25%{transform:translateY(-30px) rotateX(calc(var(--rx,45deg) + 10deg)) rotateZ(calc(var(--rz,45deg) - 5deg))}
            50%{transform:translateY(-15px) rotateX(calc(var(--rx,45deg) - 5deg)) rotateZ(calc(var(--rz,45deg) + 10deg))}
            75%{transform:translateY(-25px) rotateX(calc(var(--rx,45deg) + 5deg)) rotateZ(calc(var(--rz,45deg) - 10deg))}
        }

        .grid-lines{position:fixed;inset:0;z-index:1;pointer-events:none;
            background-image:linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);
            background-size:60px 60px}

        .login-container{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

        .login-card{width:100%;max-width:420px;background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 40px;box-shadow:0 25px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden;transform:perspective(1000px) rotateX(2deg);transition:transform .4s ease,box-shadow .4s ease}
        .login-card:hover{transform:perspective(1000px) rotateX(0deg) translateY(-5px);box-shadow:0 35px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
        .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
        .login-card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 30%,rgba(99,102,241,.08),transparent 50%);pointer-events:none}

        .logo-3d{width:72px;height:72px;margin:0 auto 24px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(99,102,241,.4),0 0 0 1px rgba(255,255,255,.1) inset;transform:perspective(500px) rotateY(-10deg) rotateX(5deg);transition:transform .4s ease}
        .logo-3d:hover{transform:perspective(500px) rotateY(0deg) rotateX(0deg) scale(1.05)}
        .logo-3d svg{filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}

        .login-title{font-size:1.8rem;font-weight:800;color:#fff;text-align:center;margin-bottom:8px;letter-spacing:-.03em}
        .login-subtitle{font-size:14px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:36px}

        .form-group{margin-bottom:20px;position:relative}
        .form-group label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:8px;letter-spacing:.02em}
        .input-wrapper{position:relative}
        .input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);transition:color .2s}
        .form-group input{width:100%;padding:14px 16px 14px 48px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:15px;font-family:inherit;transition:all .2s;outline:none}
        .form-group input::placeholder{color:rgba(255,255,255,.25)}
        .form-group input:focus{border-color:rgba(99,102,241,.5);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
        .form-group input:focus ~ .input-icon{color:#818cf8}

        .error-message{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 16px;color:#f87171;font-size:13px;margin-bottom:20px;display:none}

        .login-btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(99,102,241,.35)}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(99,102,241,.45)}
        .login-btn:active{transform:translateY(0)}
        .login-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
        .login-btn:hover::before{left:100%}
        .login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

        .register-link{text-align:center;margin-top:28px;font-size:14px;color:rgba(255,255,255,.4)}
        .register-link a{color:#818cf8;text-decoration:none;font-weight:600;transition:color .2s}
        .register-link a:hover{color:#a78bfa}

        .demo-hint{margin-top:24px;padding:16px;background:rgba(99,102,241,.06);border:1px solid rgba(99,102,241,.1);border-radius:12px;text-align:center}
        .demo-hint p{font-size:12px;color:rgba(255,255,255,.4);line-height:1.6}
        .demo-hint strong{color:rgba(255,255,255,.6)}

        .particles{position:fixed;inset:0;z-index:2;pointer-events:none}
        .particle{position:absolute;width:3px;height:3px;background:rgba(99,102,241,.4);border-radius:50%;animation:particleFloat 15s infinite linear}
        @keyframes particleFloat{
            0%{transform:translateY(100vh) translateX(0);opacity:0}
            10%{opacity:1}
            90%{opacity:1}
            100%{transform:translateY(-100px) translateX(100px);opacity:0}
        }

        @media(max-width:480px){
            .login-card{padding:36px 24px;margin:10px}
            .login-title{font-size:1.5rem}
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
    </div>
    
    <div class="grid-lines"></div>
    
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-3d">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to continue to SplitEase</p>
            
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required placeholder="Enter your username" autocomplete="off" autofocus>
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="new-password">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="btnText">Sign In</span>
                </button>
            </form>
            
            <p class="register-link">Don't have an account? <a href="/register.html">Create one</a></p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    // Create floating particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (10 + Math.random() * 10) + 's';
        particlesContainer.appendChild(particle);
    }

    // Login button loading state
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    
    loginForm.addEventListener('submit', () => {
        loginBtn.disabled = true;
        btnText.textContent = 'Signing in...';
    });

    // Show error re-enable button
    const observer = new MutationObserver(() => {
        const errDiv = document.getElementById('errorMessage');
        if (errDiv.style.display === 'block') {
            loginBtn.disabled = false;
            btnText.textContent = 'Sign In';
        }
    });
    observer.observe(document.getElementById('errorMessage'), { attributes: true, attributeFilter: ['style'] });
    </script>
</body>
</html>
