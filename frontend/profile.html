<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SplitEase</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .profile-hero{text-align:center;padding:60px 24px 40px;position:relative;background:linear-gradient(180deg,rgba(99,102,241,.06) 0%,transparent 100%)}
        .profile-avatar-lg{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:800;margin:0 auto 18px;box-shadow:0 10px 30px rgba(99,102,241,.35)}
        .profile-hero h2{font-size:1.7rem;font-weight:800;margin-bottom:6px}
        .profile-hero .text-muted{font-size:15px;color:var(--sub)}
        .edit-btn{position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
        .edit-btn:hover{border-color:#6366f1;background:rgba(99,102,241,.08)}

        .profile-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 32px}
        .profile-stat-item{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:22px 16px;text-align:center;box-shadow:var(--shadow)}
        .profile-stat-item .stat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
        .profile-stat-item .stat-val{font-size:1.3rem;font-weight:800;color:var(--text)}
        .profile-stat-item .stat-lbl{font-size:12px;color:var(--sub);margin-top:4px;font-weight:500}

        .profile-menu{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
        .profile-menu-item{display:flex;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid var(--bdr);transition:background .15s;cursor:pointer;text-decoration:none;color:var(--text)}
        .profile-menu-item:last-child{border:none}
        .profile-menu-item:hover{background:var(--bg)}
        .profile-menu-item .menu-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .profile-menu-item .menu-text{flex:1}
        .profile-menu-item .menu-label{font-size:15px;font-weight:600}
        .profile-menu-item .menu-sub{font-size:13px;color:var(--sub);margin-top:2px}
        .profile-menu-item .menu-arrow{color:var(--sub);font-size:18px}

        .logout-btn{margin-top:24px;padding:18px;background:var(--card);border:1px solid var(--red);border-radius:16px;color:var(--red);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;transition:all .15s;width:100%}
        .logout-btn:hover{background:var(--red);color:#fff}

        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
        .modal-overlay.active{display:flex}
        .modal{background:var(--card);border-radius:20px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;transition:all .3s ease;display:flex;flex-direction:column}
        .modal.maximized{max-width:100%;width:100%;height:100%;border-radius:0;max-height:100%}
        .modal.maximized .modal-body{flex:1;overflow-y:auto}
        .modal-head{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid var(--bdr);flex-shrink:0}
        .modal-head h3{font-size:18px;font-weight:700}
        .modal-head-right{display:flex;gap:8px}
        .modal-close,.modal-toggle{width:36px;height:36px;border-radius:10px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);transition:all .15s}
        .modal-close:hover,.modal-toggle:hover{background:var(--bdr);color:var(--text)}
        .modal-body{padding:28px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}
        .form-group input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--bdr);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;transition:border-color .2s}
        .form-group input:focus{outline:none;border-color:#6366f1}
        .modal-footer{padding:0 28px 28px;display:flex;gap:12px}
        .modal-footer .btn{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:all .2s}
        .btn-cancel{background:var(--bg);border:1px solid var(--bdr);color:var(--text)}
        .btn-cancel:hover{background:var(--bdr)}
        .btn-save{background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
        .btn-save:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(99,102,241,.4)}
        .btn-save:disabled{opacity:.6;cursor:not-allowed;transform:none}
    </style>
</head>
<body>
    <nav class="navbar">
        <button class="nav-menu-btn" onclick="toggleDrawer()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="nav-brand">SplitEase</div>
        <div class="nav-user">
            <span id="userName"></span>
            <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
        </div>
    </nav>

            </button>
        </div>
        <div class="drawer-links">

                <span>Home</span>
            </a>
            <a href="/groups.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Groups</span>
            </a>
            <a href="/settlements.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/><path d="M17 7l-5-5-5 5"/></svg>
                <span>Settlements</span>

            <a href="/balance.html" class="drawer-link">

                <span>Balance</span>
            </a>
            <a href="/income.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/><path d="M17 7l-5-5-5 5"/></svg>
                <span>Income</span>
            </a>
            <a href="/expenses.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Expenses</span>
            </a>
            <a href="/reports.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Reports</span>
            </a>
            <a href="/charts.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>Charts</span>
            </a>
            <a href="/profile.html" class="drawer-link active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>
</div>

    <div class="main-content" style="padding-bottom:80px;">
        <div class="profile-hero">
            <div class="edit-btn" onclick="openEditModal()" title="Edit Profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
            <div class="profile-avatar-lg" id="profileAvatar">K</div>
            <h2 id="profileName">Loading...</h2>
            <p id="profileEmail" class="text-muted"></p>
        </div>

        <div class="profile-stats-row">
            <div class="profile-stat-item">
                <div class="stat-icon" style="background:rgba(99,102,241,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="stat-val" id="statGroups">0</div>
                <div class="stat-lbl">Groups</div>
            </div>
            <div class="profile-stat-item">
                <div class="stat-icon" style="background:rgba(16,185,129,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </div>
                <div class="stat-val" id="statExpenses">0</div>
                <div class="stat-lbl">Expenses</div>
            </div>
            <div class="profile-stat-item">
                <div class="stat-icon" style="background:rgba(239,68,68,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="stat-val" id="statTotal">&#8377;0</div>
                <div class="stat-lbl">Spent</div>
            </div>
        </div>

        <div class="profile-menu">
            <div class="profile-menu-item">
                <div class="menu-icon" style="background:rgba(99,102,241,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="menu-text">
                    <div class="menu-label">Username</div>
                    <div class="menu-sub" id="infoUsername">-</div>
                </div>
            </div>
            <div class="profile-menu-item">
                <div class="menu-icon" style="background:rgba(16,185,129,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="menu-text">
                    <div class="menu-label">Full Name</div>
                    <div class="menu-sub" id="infoFullName">-</div>
                </div>
            </div>
            <div class="profile-menu-item">
                <div class="menu-icon" style="background:rgba(245,158,11,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div class="menu-text">
                    <div class="menu-label">Email</div>
                    <div class="menu-sub" id="infoEmail">-</div>
                </div>
            </div>
            <div class="profile-menu-item">
                <div class="menu-icon" style="background:rgba(139,92,246,.1)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
                <div class="menu-text">
                    <div class="menu-label">Phone</div>
                    <div class="menu-sub" id="infoPhone">-</div>
                </div>
            </div>
        </div>

        <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
    </div>

    <nav class="bottom-nav">
        <a href="/dashboard.html" class="bottom-nav-item">

            <span>Home</span>
        </a>
        <a href="/charts.html" class="bottom-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Charts</span>
        </a>
        <a href="/expenses.html" class="bottom-nav-item">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span>Create</span>
        </a>
        <a href="/reports.html" class="bottom-nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Reports</span>
        </a>
        <a href="/profile.html" class="bottom-nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-head">
                <h3>Edit Profile</h3>
                <div class="modal-head-right">
                    <button class="modal-toggle" onclick="toggleModalSize()" title="Maximize" id="toggleBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="toggleIcon"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    </button>
                    <button class="modal-close" onclick="closeEditModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="editUsername" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editFullName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" placeholder="Enter email address">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="editPhone" placeholder="Enter phone number">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-save" id="saveProfileBtn" onclick="saveProfile()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/profile.js"></script>
    <script>
function toggleDrawer() {
    document.getElementById('navDrawer').classList.toggle('open');
}
</script>
</body>
</html>
