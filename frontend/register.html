<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SplitEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;min-height:100vh;background:#0f0f23;overflow-x:hidden;position:relative}

        .bg-gradient{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f23 0%,#1a1a3e 50%,#0f0f23 100%);z-index:0}

        .floating-shapes{position:fixed;inset:0;z-index:1;pointer-events:none}
        .shape{position:absolute;border-radius:50%;filter:blur(1px);animation:float 20s infinite ease-in-out}
        .shape-1{width:300px;height:300px;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.08));top:-100px;left:-100px;animation-delay:0s}
        .shape-2{width:200px;height:200px;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(52,211,153,.06));bottom:-50px;right:-50px;animation-delay:-5s}
        .shape-3{width:150px;height:150px;background:linear-gradient(135deg,rgba(236,72,153,.1),rgba(244,114,182,.05));top:40%;right:20%;animation-delay:-10s}
        .shape-4{width:100px;height:100px;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(251,191,36,.05));bottom:30%;left:15%;animation-delay:-15s}

        @keyframes float{
            0%,100%{transform:translateY(0) scale(1)}
            50%{transform:translateY(-30px) scale(1.05)}
        }

        .grid-lines{position:fixed;inset:0;z-index:1;pointer-events:none;
            background-image:linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);
            background-size:60px 60px}

        .register-container{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}

        .register-card{width:100%;max-width:480px;background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 40px;box-shadow:0 25px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden}
        .register-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}

        .logo-3d{width:72px;height:72px;margin:0 auto 24px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(99,102,241,.4),0 0 0 1px rgba(255,255,255,.1) inset;transform:perspective(500px) rotateY(-10deg) rotateX(5deg);transition:transform .4s ease}
        .logo-3d:hover{transform:perspective(500px) rotateY(0deg) rotateX(0deg) scale(1.05)}

        .register-title{font-size:1.6rem;font-weight:800;color:#fff;text-align:center;margin-bottom:8px;letter-spacing:-.03em}
        .register-subtitle{font-size:14px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:32px}

        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .form-group{margin-bottom:18px}
        .form-group.full{grid-column:1/-1}
        .form-group label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:6px;letter-spacing:.02em}
        .input-wrapper{position:relative}
        .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.25);transition:color .2s}
        .form-group input{width:100%;padding:13px 14px 13px 42px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font-size:14px;font-family:inherit;transition:all .2s;outline:none}
        .form-group input::placeholder{color:rgba(255,255,255,.2)}
        .form-group input:focus{border-color:rgba(99,102,241,.5);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
        .form-group input:focus ~ .input-icon{color:#818cf8}

        .password-strength{height:4px;border-radius:2px;margin-top:8px;background:rgba(255,255,255,.08);overflow:hidden;transition:all .3s}
        .password-strength.weak{background:linear-gradient(90deg,#ef4444,#f87171)}
        .password-strength.medium{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
        .password-strength.strong{background:linear-gradient(90deg,#10b981,#34d399)}

        .password-requirements{margin:12px 0 20px;padding:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:10px}
        .password-requirements p{font-size:11px;font-weight:600;color:rgba(255,255,255,.4);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
        .password-requirements ul{list-style:none}
        .password-requirements li{font-size:12px;color:rgba(255,255,255,.3);padding:3px 0;display:flex;align-items:center;gap:8px;transition:color .2s}
        .password-requirements li::before{content:'';width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .2s}
        .password-requirements li.met{color:#34d399}
        .password-requirements li.met::before{background:#10b981}

        .error-message{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 14px;color:#f87171;font-size:13px;margin-bottom:16px;display:none}

        .register-btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(99,102,241,.35)}
        .register-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(99,102,241,.45)}
        .register-btn:active{transform:translateY(0)}
        .register-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
        .register-btn:hover::before{left:100%}
        .register-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

        .login-link{text-align:center;margin-top:24px;font-size:14px;color:rgba(255,255,255,.4)}
        .login-link a{color:#818cf8;text-decoration:none;font-weight:600;transition:color .2s}
        .login-link a:hover{color:#a78bfa}

        @media(max-width:480px){
            .register-card{padding:32px 20px}
            .form-row{grid-template-columns:1fr}
            .register-title{font-size:1.3rem}
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>
    
    <div class="grid-lines"></div>

    <div class="register-container">
        <div class="register-card">
            <div class="logo-3d">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
            </div>
            
            <h1 class="register-title">Create your account</h1>
            <p class="register-subtitle">Start splitting expenses today</p>
            
            <form id="registerForm" autocomplete="off">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-wrapper">
                            <input type="text" id="username" name="username" required placeholder="johndoe" minlength="3">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" name="email" required placeholder="you@example.com">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Phone (optional)</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phone" name="phone" placeholder="+91 XXXXX XXXXX">
                            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/></svg>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required placeholder="Min 8 chars, mixed case, digit, symbol" minlength="8" autocomplete="new-password">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password" autocomplete="new-password">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                </div>
                
                <div class="password-requirements">
                    <p>Password Requirements</p>
                    <ul>
                        <li id="req-length">At least 8 characters</li>
                        <li id="req-upper">One uppercase letter</li>
                        <li id="req-lower">One lowercase letter</li>
                        <li id="req-digit">One digit</li>
                        <li id="req-special">One special character (!@#$%^&*)</li>
                    </ul>
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" class="register-btn" id="registerBtn">
                    <span id="btnText">Create Account</span>
                </button>
            </form>
            
            <p class="login-link">Already have an account? <a href="/login.html">Sign in</a></p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const btnText = document.getElementById('btnText');
    
    registerForm.addEventListener('submit', () => {
        registerBtn.disabled = true;
        btnText.textContent = 'Creating account...';
    });

    const observer = new MutationObserver(() => {
        const errDiv = document.getElementById('errorMessage');
        if (errDiv.style.display === 'block') {
            registerBtn.disabled = false;
            btnText.textContent = 'Create Account';
        }
    });
    observer.observe(document.getElementById('errorMessage'), { attributes: true, attributeFilter: ['style'] });
    </script>
</body>
</html>
