<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - SplitEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;min-height:100vh;background:#0f0f23;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}

        .bg-gradient{position:fixed;inset:0;background:linear-gradient(135deg,#0f0f23 0%,#1a1a3e 50%,#0f0f23 100%);z-index:0}

        .floating-shapes{position:fixed;inset:0;z-index:1;pointer-events:none}
        .shape{position:absolute;border-radius:50%;filter:blur(1px);animation:float 20s infinite ease-in-out}
        .shape-1{width:250px;height:250px;background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(52,211,153,.08));top:-80px;right:-80px;animation-delay:0s}
        .shape-2{width:180px;height:180px;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.06));bottom:-40px;left:-40px;animation-delay:-5s}
        .shape-3{width:120px;height:120px;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(251,191,36,.05));top:40%;left:10%;animation-delay:-10s}

        @keyframes float{
            0%,100%{transform:translateY(0) scale(1)}
            50%{transform:translateY(-25px) scale(1.03)}
        }

        .grid-lines{position:fixed;inset:0;z-index:1;pointer-events:none;
            background-image:linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px);
            background-size:60px 60px}

        .otp-card{position:relative;z-index:10;width:100%;max-width:440px;background:rgba(255,255,255,.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 40px;box-shadow:0 25px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05);text-align:center}
        .otp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}

        .otp-icon{width:80px;height:80px;border-radius:24px;background:linear-gradient(135deg,#10b981,#34d399);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 12px 40px rgba(16,185,129,.35),0 0 0 1px rgba(255,255,255,.1) inset;transform:perspective(500px) rotateY(-8deg) rotateX(5deg);transition:transform .4s ease}
        .otp-icon:hover{transform:perspective(500px) rotateY(0deg) rotateX(0deg) scale(1.05)}
        .otp-icon svg{filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}

        .otp-title{font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:-.03em}
        .otp-subtitle{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:32px;line-height:1.6}
        .otp-subtitle strong{color:rgba(255,255,255,.8);font-weight:600}

        .otp-inputs{display:flex;gap:12px;justify-content:center;margin-bottom:28px}
        .otp-inputs input{width:52px;height:60px;text-align:center;font-size:1.5rem;font-weight:700;border:2px solid rgba(255,255,255,.08);border-radius:14px;font-family:inherit;transition:all .2s;background:rgba(255,255,255,.04);color:#fff}
        .otp-inputs input::placeholder{color:rgba(255,255,255,.15)}
        .otp-inputs input:focus{outline:none;border-color:rgba(99,102,241,.5);background:rgba(255,255,255,.06);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
        .otp-inputs input.filled{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}

        .error-message{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 14px;color:#f87171;font-size:13px;margin-bottom:16px;display:none}

        .otp-demo{margin-bottom:20px;padding:14px;background:rgba(99,102,241,.08);border:1px dashed rgba(99,102,241,.3);border-radius:12px;font-size:13px;color:rgba(255,255,255,.6);display:none}
        .otp-demo code{font-weight:700;font-size:18px;letter-spacing:4px;color:#818cf8}

        .verify-btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#10b981,#34d399);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(16,185,129,.35)}
        .verify-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(16,185,129,.45)}
        .verify-btn:active{transform:translateY(0)}
        .verify-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
        .verify-btn:hover::before{left:100%}
        .verify-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

        .otp-actions{margin-top:24px;display:flex;flex-direction:column;gap:12px;align-items:center}
        .otp-resend{color:#818cf8;font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit;transition:color .2s}
        .otp-resend:hover{color:#a78bfa}
        .otp-resend:disabled{color:rgba(255,255,255,.25);cursor:not-allowed}
        .otp-back{color:rgba(255,255,255,.4);font-size:13px;text-decoration:none;font-weight:500;transition:color .2s}
        .otp-back:hover{color:rgba(255,255,255,.7)}
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <div class="grid-lines"></div>

    <div class="otp-card">
        <div class="otp-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        
        <h1 class="otp-title">Verify Your Identity</h1>
        <p class="otp-subtitle">We've sent a 6-digit code to<br><strong id="maskedEmail">***@***.com</strong></p>

        <div class="otp-inputs">
            <input type="text" maxlength="1" class="otp-digit" data-index="0" inputmode="numeric" autocomplete="off">
            <input type="text" maxlength="1" class="otp-digit" data-index="1" inputmode="numeric" autocomplete="off">
            <input type="text" maxlength="1" class="otp-digit" data-index="2" inputmode="numeric" autocomplete="off">
            <input type="text" maxlength="1" class="otp-digit" data-index="3" inputmode="numeric" autocomplete="off">
            <input type="text" maxlength="1" class="otp-digit" data-index="4" inputmode="numeric" autocomplete="off">
            <input type="text" maxlength="1" class="otp-digit" data-index="5" inputmode="numeric" autocomplete="off">
        </div>

        <div id="otpError" class="error-message"></div>
        <div id="otpDemo" class="otp-demo">Demo OTP: <code id="demoOtp"></code></div>

        <button class="verify-btn" id="verifyBtn" onclick="verifyOtp()" disabled>Verify</button>

        <div class="otp-actions">
            <button class="otp-resend" id="resendBtn" onclick="resendOtp()">Resend OTP</button>
            <a href="/login.html" class="otp-back">Back to Login</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
    let otpUsername = '';
    let countdown = 30;
    let timer = null;

    document.addEventListener('DOMContentLoaded', () => {
        otpUsername = sessionStorage.getItem('otpUsername');
        const maskedEmail = sessionStorage.getItem('otpMaskedEmail');
        const demoOtp = sessionStorage.getItem('otpDemo');

        if (!otpUsername) {
            window.location.href = '/login.html';
            return;
        }

        if (maskedEmail) document.getElementById('maskedEmail').textContent = maskedEmail;
        if (demoOtp) {
            document.getElementById('otpDemo').style.display = 'block';
            document.getElementById('demoOtp').textContent = demoOtp;
        }

        setupInputs();
        startCountdown();
    });

    function setupInputs() {
        const inputs = document.querySelectorAll('.otp-digit');
        inputs.forEach((input, i) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val;
                if (val && i < 5) inputs[i + 1].focus();
                updateVerifyBtn();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    inputs[i - 1].focus();
                    inputs[i - 1].value = '';
                }
                if (e.key === 'Enter') verifyOtp();
            });
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                for (let j = 0; j < Math.min(6, text.length); j++) {
                    inputs[j].value = text[j];
                    inputs[j].classList.add('filled');
                }
                if (text.length >= 6) inputs[5].focus();
                updateVerifyBtn();
            });
            input.addEventListener('focus', () => input.select());
        });
    }

    function updateVerifyBtn() {
        const inputs = document.querySelectorAll('.otp-digit');
        let code = '';
        inputs.forEach(i => { code += i.value; i.classList.toggle('filled', !!i.value); });
        document.getElementById('verifyBtn').disabled = code.length !== 6;
    }

    function getOtp() {
        let code = '';
        document.querySelectorAll('.otp-digit').forEach(i => code += i.value);
        return code;
    }

    async function verifyOtp() {
        const otp = getOtp();
        if (otp.length !== 6) return;

        const errDiv = document.getElementById('otpError');
        errDiv.style.display = 'none';
        document.getElementById('verifyBtn').disabled = true;
        document.getElementById('verifyBtn').textContent = 'Verifying...';

        const res = await API.post('/api/otp/verify', { username: otpUsername, otp });

        if (res && res.success) {
            API.setToken(res.token);
            API.setUser(res.user);
            sessionStorage.removeItem('otpUsername');
            sessionStorage.removeItem('otpMaskedEmail');
            sessionStorage.removeItem('otpDemo');
            window.location.href = '/dashboard.html';
        } else {
            errDiv.textContent = res ? res.message : 'Invalid OTP';
            errDiv.style.display = 'block';
            document.getElementById('verifyBtn').disabled = false;
            document.getElementById('verifyBtn').textContent = 'Verify';
            document.querySelectorAll('.otp-digit').forEach(i => { i.value = ''; i.classList.remove('filled'); });
            document.querySelectorAll('.otp-digit')[0].focus();
        }
    }

    function startCountdown() {
        const btn = document.getElementById('resendBtn');
        btn.disabled = true;
        countdown = 30;
        clearInterval(timer);
        timer = setInterval(() => {
            countdown--;
            btn.textContent = 'Resend OTP (' + countdown + 's)';
            if (countdown <= 0) {
                clearInterval(timer);
                btn.textContent = 'Resend OTP';
                btn.disabled = false;
            }
        }, 1000);
    }

    async function resendOtp() {
        const errDiv = document.getElementById('otpError');
        errDiv.style.display = 'none';
        const res = await API.post('/api/otp/send', { username: otpUsername });
        if (res && res.success) {
            if (res.otp) {
                document.getElementById('otpDemo').style.display = 'block';
                document.getElementById('demoOtp').textContent = res.otp;
            }
            if (res.maskedEmail) document.getElementById('maskedEmail').textContent = res.maskedEmail;
            startCountdown();
        } else {
            errDiv.textContent = res ? res.message : 'Failed to resend';
            errDiv.style.display = 'block';
        }
    }
    </script>
</body>
</html>
