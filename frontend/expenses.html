<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - SplitEase</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .page-head{display:flex;align-items:center;justify-content:space-between;padding:32px 0 20px;flex-wrap:wrap;gap:12px}
        .page-head h1{font-size:1.4rem;font-weight:800}
        .filter-row{display:flex;gap:8px;align-items:center}
        .select-input{padding:9px 14px;border:1.5px solid var(--bdr);border-radius:10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);cursor:pointer;transition:border .15s}
        .select-input:focus{outline:none;border-color:var(--pri-a);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
        .btn-add{display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#818cf8);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(99,102,241,.3);transition:all .2s}
        .btn-add:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,.4)}

        .stat-row{display:flex;gap:12px;margin-bottom:24px}
        .stat-box{flex:1;background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px;text-align:center;box-shadow:var(--shadow)}
        .stat-box .s-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .stat-box .s-val{font-size:1.2rem;font-weight:800;color:var(--text)}
        .stat-box .s-lbl{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}

        .card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
        .card-body{padding:4px 0}
        .item-row{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--bdr);transition:background .12s}
        .item-row:last-child{border:none}
        .item-row:hover{background:var(--bg)}
        .item-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
        .item-details{flex:1;min-width:0}
        .item-name{font-size:14px;font-weight:600;color:var(--text)}
        .item-sub{font-size:12px;color:var(--sub);margin-top:1px}
        .item-amount{font-size:14px;font-weight:700;flex-shrink:0}
        .item-del{padding:4px 10px;border-radius:8px;border:1.5px solid var(--red);color:var(--red);background:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;flex-shrink:0}
        .item-del:hover{background:var(--red);color:#fff}
        .empty-state{padding:32px;text-align:center;color:var(--muted);font-size:13px}

        .icon-food{background:rgba(245,158,11,.12);color:#f59e0b}
        .icon-transport{background:rgba(99,102,241,.12);color:#6366f1}
        .icon-entertainment{background:rgba(236,72,153,.12);color:#ec4899}
        .icon-shopping{background:rgba(16,185,129,.12);color:#10b981}
        .icon-bills{background:rgba(239,68,68,.12);color:#ef4444}
        .icon-health{background:rgba(14,165,233,.12);color:#0ea5e9}
        .icon-education{background:rgba(139,92,246,.12);color:#8b5cf6}
        .icon-travel{background:rgba(6,182,212,.12);color:#06b6d4}
        .icon-groceries{background:rgba(22,163,74,.12);color:#16a34a}
        .icon-coffee{background:rgba(180,83,9,.12);color:#b45309}
        .icon-rent{background:rgba(220,38,38,.12);color:#dc2626}
        .icon-general{background:rgba(107,114,128,.12);color:#6b7280}
        .icon-income{background:rgba(16,185,129,.12);color:#10b981}

        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200}
        .modal-content{background:var(--card);border-radius:16px;padding:28px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .modal-header h2{font-size:1.1rem;font-weight:700}
        .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--sub);padding:4px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
        .form-group input,.form-group select{width:100%;padding:12px 14px;border:1.5px solid var(--bdr);border-radius:10px;font-size:14px;font-family:inherit;transition:border .15s}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--pri-a);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
        .error-message{color:var(--red);font-size:13px;margin-bottom:12px;display:none}
        .btn-full{width:100%;padding:12px;font-size:14px;font-weight:600;border:none;border-radius:10px;cursor:pointer;font-family:inherit}
        .btn-primary{background:var(--pri-a);color:#fff}
    </style>
</head>
<body>

        </button>
        <div class="nav-brand">SplitEase</div>
        <div class="nav-user">
            <span id="userName"></span>
            <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
        </div>
    </nav>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="drawer-links">

                <span>Home</span>
            </a>
            <a href="/groups.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Groups</span>
            </a>
            <a href="/settlements.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/><path d="M17 7l-5-5-5 5"/></svg>

            </a>
            <a href="/balance.html" class="drawer-link">

                <span>Income</span>
            </a>
            <a href="/expenses.html" class="drawer-link active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Expenses</span>
            </a>
            <a href="/reports.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Reports</span>
            </a>
            <a href="/charts.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>Charts</span>
            </a>
            <a href="/profile.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>
</div>

    <div class="main-content" style="padding-bottom: 80px;">
        <div class="page-head">
            <h1>Expenses</h1>
            <div class="filter-row">
                <select id="yearSelect" class="select-input"></select>
                <select id="monthSelect" class="select-input">
                    <option value="0">All Months</option>
                    <option value="1">Jan</option><option value="2">Feb</option>
                    <option value="3">Mar</option><option value="4">Apr</option>
                    <option value="5">May</option><option value="6">Jun</option>
                    <option value="7">Jul</option><option value="8">Aug</option>
                    <option value="9">Sep</option><option value="10">Oct</option>
                    <option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <button class="btn-add" onclick="showAddExpense()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New
                </button>
            </div>
        </div>

        <div class="stat-row">
            <div class="stat-box">
                <div class="s-icon" style="background:rgba(239,68,68,.12)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="s-val" id="filterTotal">&#8377;0</div>
                <div class="s-lbl">Total Spent</div>
            </div>
            <div class="stat-box">
                <div class="s-icon" style="background:rgba(99,102,241,.12)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <div class="s-val" id="filterCount">0</div>
                <div class="s-lbl">Entries</div>
            </div>
        </div>

        <div id="expensesList" class="card">
            <div class="card-body">
                <p class="empty-state">No expenses found</p>
            </div>
        </div>
    </div>

    <div id="expenseModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create Expense</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label for="expDesc">Description</label>
                <input type="text" id="expDesc" placeholder="What was it for?">
            </div>
            <div class="form-group">
                <label for="expAmount">Amount (&#8377;)</label>
                <input type="number" id="expAmount" placeholder="0.00" step="0.01" min="0.01">
            </div>
            <div class="form-group">
                <label for="expCategory">Category</label>
                <select id="expCategory">
                    <option value="">Select category...</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Travel">Travel</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Coffee">Coffee</option>
                    <option value="Rent">Rent</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="form-group">
                <label for="expGroup">Group (optional)</label>
                <select id="expGroup"><option value="">Personal / No group</option></select>
            </div>
            <div class="form-group">
                <label for="expSplit">Split Type</label>
                <select id="expSplit"><option value="equal">Equal</option><option value="exact">Exact</option><option value="percentage">Percentage</option></select>
            </div>
            <div class="form-group">
                <label for="expYear">Year</label>
                <select id="expYear" class="select-input" style="width:100%">
                    <option value="2026">2026</option><option value="2025">2025</option><option value="2024">2024</option><option value="2023">2023</option>
                </select>
            </div>
            <div class="form-group">
                <label for="expMonth">Month</label>
                <select id="expMonth" class="select-input" style="width:100%">
                    <option value="1">January</option><option value="2">February</option>
                    <option value="3">March</option><option value="4">April</option>
                    <option value="5">May</option><option value="6">June</option>
                    <option value="7">July</option><option value="8">August</option>
                    <option value="9">September</option><option value="10">October</option>
                    <option value="11">November</option><option value="12">December</option>
                </select>
            </div>
            <div id="expError" class="error-message" style="display:none;"></div>
            <button class="btn-full btn-primary" onclick="createExpense()">Create Expense</button>
        </div>
    </div>
    </div>
