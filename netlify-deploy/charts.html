<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charts - SplitEase</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        .charts-header{padding:32px 0 8px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
        .charts-header h1{font-size:1.4rem;font-weight:800}
        .filter-row{display:flex;gap:8px}
        .select-input{padding:8px 14px;border-radius:10px;border:1px solid var(--bdr);background:var(--card);color:var(--text);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer}

        .summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 24px}
        .sum-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px 16px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
        .sum-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
        .sum-card:nth-child(1)::before{background:linear-gradient(90deg,#ef4444,#f87171)}
        .sum-card:nth-child(2)::before{background:linear-gradient(90deg,#6366f1,#818cf8)}
        .sum-card:nth-child(3)::before{background:linear-gradient(90deg,#10b981,#34d399)}
        .sum-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
        .sum-card:nth-child(1) .sum-icon{background:rgba(239,68,68,.12);color:#ef4444}
        .sum-card:nth-child(2) .sum-icon{background:rgba(99,102,241,.12);color:#6366f1}
        .sum-card:nth-child(3) .sum-icon{background:rgba(16,185,129,.12);color:#10b981}
        .sum-val{font-size:1.3rem;font-weight:800;color:var(--text)}
        .sum-lbl{font-size:11px;color:var(--sub);margin-top:2px;font-weight:500}

        .chart-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
        .chart-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bdr)}
        .chart-head .ch-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
        .chart-head h3{font-size:15px;font-weight:700;flex:1}
        .chart-body{padding:16px}

        .legend-list{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 16px}
        .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
        .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

        .cat-rank{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--bdr)}
        .cat-rank:last-child{border:none}
        .rank-num{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
        .rank-1{background:rgba(245,158,11,.15);color:#f59e0b}
        .rank-2{background:rgba(156,163,175,.15);color:#9ca3af}
        .rank-3{background:rgba(180,83,9,.15);color:#b45309}
        .rank-n{background:var(--bg);color:var(--sub)}
        .rank-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .rank-info{flex:1}
        .rank-name{font-size:13px;font-weight:600;color:var(--text)}
        .rank-bar-wrap{height:5px;background:var(--bdr);border-radius:3px;margin-top:4px;overflow:hidden}
        .rank-bar{height:100%;border-radius:3px}
        .rank-amt{text-align:right;flex-shrink:0}
        .rank-val{font-size:13px;font-weight:700;color:var(--text)}
        .rank-pct{font-size:11px;color:var(--sub)}

        .empty-state{padding:32px;text-align:center;color:var(--muted);font-size:13px}

        .cat-rank{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--bdr)}
        .cat-rank:last-child{border:none}
        .rank-num{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
        .rank-1{background:rgba(245,158,11,.15);color:#f59e0b}
        .rank-2{background:rgba(156,163,175,.15);color:#9ca3af}
        .rank-3{background:rgba(180,83,9,.15);color:#b45309}
        .rank-n{background:var(--bg);color:var(--sub)}
        .rank-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .rank-info{flex:1;min-width:0}
        .rank-name{font-size:13px;font-weight:600;color:var(--text)}
        .rank-bar-wrap{height:5px;background:var(--bdr);border-radius:3px;margin-top:4px;overflow:hidden}
        .rank-bar{height:100%;border-radius:3px;transition:width .5s ease}
        .rank-amt{text-align:right;flex-shrink:0}
        .rank-val{font-size:13px;font-weight:700;color:var(--text)}
        .rank-pct{font-size:11px;color:var(--sub)}
    </style>
</head>
<body>
    <nav class="navbar">
        <button class="nav-menu-btn" onclick="toggleDrawer()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="nav-brand">SplitEase</div>
        <div class="nav-user">
            <span id="userName"></span>
            <button id="logoutBtn" class="btn btn-sm btn-outline">Logout</button>
        </div>
    </nav>

<div class="nav-drawer" id="navDrawer">
    <div class="drawer-overlay" onclick="toggleDrawer()"></div>
    <div class="drawer-panel">
        <div class="drawer-header">
            <div class="drawer-logo">SplitEase</div>
            <button class="drawer-close" onclick="toggleDrawer()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="drawer-links">
            <a href="/dashboard.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="/groups.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Groups</span>
            </a>
            <a href="/settlements.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/><path d="M17 7l-5-5-5 5"/></svg>
                <span>Settlements</span>
            </a>
            <a href="/balance.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                <span>Balance</span>
            </a>
            <a href="/income.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20"/><path d="M17 7l-5-5-5 5"/></svg>
                <span>Income</span>
            </a>
            <a href="/expenses.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                <span>Expenses</span>
            </a>
            <a href="/reports.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span>Reports</span>
            </a>
            <a href="/charts.html" class="drawer-link active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                <span>Charts</span>
            </a>
            <a href="/profile.html" class="drawer-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </div>
    </div>
</div>

    <div class="main-content" style="padding-bottom:100px;">
        <div class="charts-header">
            <h1>Charts & Insights</h1>
            <div class="filter-row">
                <select id="yearSelect" class="select-input"></select>
                <select id="monthSelect" class="select-input">
                    <option value="0">All Months</option>
                    <option value="1">January</option><option value="2">February</option>
                    <option value="3">March</option><option value="4">April</option>
                    <option value="5">May</option><option value="6">June</option>
                    <option value="7">July</option><option value="8">August</option>
                    <option value="9">September</option><option value="10">October</option>
                    <option value="11">November</option><option value="12">December</option>
                </select>
            </div>
        </div>

        <div class="summary-row">
            <div class="sum-card">
                <div class="sum-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div class="sum-val" id="totalSpent">₹0</div>
                <div class="sum-lbl">Total Spent</div>
            </div>
            <div class="sum-card">
                <div class="sum-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                </div>
                <div class="sum-val" id="totalTxns">0</div>
                <div class="sum-lbl">Transactions</div>
            </div>
            <div class="sum-card">
                <div class="sum-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </div>
                <div class="sum-val" id="avgSpend">₹0</div>
                <div class="sum-lbl">Avg / Entry</div>
            </div>
        </div>

        <div class="chart-card" id="catCard">
            <div class="chart-head">
                <div class="ch-icon" style="background:rgba(99,102,241,.12)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5"><circle cx="12" cy="12" r="10"/></svg>
                </div>
                <h3>Spending by Category</h3>
            </div>
            <div class="chart-body" style="height:300px;position:relative">
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="legend-list" id="catLegend"></div>
        </div>

        <div class="chart-card" id="monthlyCard">
            <div class="chart-head">
                <div class="ch-icon" style="background:rgba(139,92,246,.12)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </div>
                <h3>Monthly Trend</h3>
            </div>
            <div class="chart-body" style="height:260px;position:relative">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <div class="chart-card" id="groupCard">
            <div class="chart-head">
                <div class="ch-icon" style="background:rgba(236,72,153,.12)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                </div>
                <h3>Spending by Group</h3>
            </div>
            <div class="chart-body" style="height:240px;position:relative">
                <canvas id="groupChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-head">
                <div class="ch-icon" style="background:rgba(245,158,11,.12)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </div>
                <h3>Top Categories</h3>
            </div>
            <div id="topCategories">
                <div class="empty-state">No data</div>
            </div>
        </div>

        <div class="chart-card" id="dailyCard">
            <div class="chart-head">
                <div class="ch-icon" style="background:rgba(16,185,129,.12)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                </div>
                <h3>Daily Spending</h3>
            </div>
            <div class="chart-body" style="height:220px;position:relative">
                <canvas id="dailyChart"></canvas>
            </div>
        </div>
    </div>

        <a href="/expenses.html" class="bottom-nav-item">

            <span>Create</span>
        </a>
        <a href="/reports.html" class="bottom-nav-item">

            <span>Profile</span>
        </a>
    </nav>

    <script src="/js/api.js"></script>
    <script src="/js/charts.js"></script>
    <script>
function toggleDrawer() {
    document.getElementById('navDrawer').classList.toggle('open');
}
</script>
</body>
</html>
