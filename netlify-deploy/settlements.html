            <a href="/charts.html" class="drawer-link">

</div>

    <div class="main-content" style="padding-bottom: 80px;">
        <div class="page-header">
            <h1>Settlements</h1>
            <button id="newSettlementBtn" class="btn btn-primary">+ New</button>
        </div>

        <div id="settlementsList">
            <p class="empty-state">No settlements yet</p>
        </div>

        <div id="newSettlementModal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>New Settlement</h2>
                    <button class="modal-close" onclick="closeModal('newSettlementModal')">&times;</button>
                </div>
                <form id="settlementForm">
                    <div class="form-group">
                        <label for="settleTo">Pay To</label>
                        <select id="settleTo" required>
                            <option value="">Select user...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="settleAmount">Amount (â‚¹)</label>
                        <input type="number" id="settleAmount" step="0.01" min="0.01" required placeholder="0.00">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Settle</button>
                </form>
            </div>
        </div>
    </div>
    </div>
